<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <title>我的刷题</title>

    <link rel="manifest" href="./manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 16px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        h2 {
            margin-top: 0;
        }

        .progress {
            color: #666;
            margin-bottom: 12px;
        }

        .type {
            display: inline-block;
            background: #eef3ff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .question {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .option {
            display: block;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ddd;
            border-radius: 9px;
            cursor: pointer;
            line-height: 1.5;
        }

        .option:hover {
            background: #f5f7ff;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
            margin: 4px;
        }

        .primary {
            background: #3478f6;
            color: white;
        }

        .secondary {
            background: #e9e9e9;
        }

        .danger {
            background: #ffdddd;
        }

        #result {
            margin-top: 18px;
            padding: 14px;
            border-radius: 9px;
            line-height: 1.7;
            display: none;
        }

        .correct {
            background: #e8f8ec;
        }

        .wrong {
            background: #ffecec;
        }

        .analysis {
            margin-top: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        #quiz {
            display: none;
        }

        input[type=file] {
            margin: 15px 0;
            width: 100%;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card" id="loader">
        <h2>我的刷题</h2>

        <p>选择题库 JSON 文件：</p>

        <input type="file"
               id="fileInput"
               accept=".json">

        <p id="loadInfo"></p>
    </div>


    <div id="quiz">

        <div class="card">

            <div class="progress" id="progress"></div>

            <div class="type" id="type"></div>

            <div class="question" id="question"></div>

            <div id="options"></div>

            <button class="primary" onclick="submitAnswer()">
                提交答案
            </button>

            <div id="result"></div>

        </div>


        <div class="card toolbar">

            <button class="secondary" onclick="prevQuestion()">
                上一题
            </button>

            <button class="secondary" onclick="randomQuestion()">
                随机一题
            </button>

            <button class="secondary" onclick="nextQuestion()">
                下一题
            </button>

        </div>

    </div>

</div>


<script>

let questions = [];
let current = 0;

let wrongQuestions = new Set(
    JSON.parse(localStorage.getItem("wrongQuestions") || "[]")
);


// ================================
// 导入 JSON
// ================================

document.getElementById("fileInput")
.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file)
        return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const data = JSON.parse(e.target.result);

            if (!data.questions ||
                !Array.isArray(data.questions)) {

                alert("不是支持的题库格式");
                return;
            }

            questions = data.questions;

            // 保存题库
            localStorage.setItem(
                "questionBank",
                JSON.stringify(data)
            );

            current =
                Number(
                    localStorage.getItem("currentQuestion") || 0
                );

            if (current >= questions.length)
                current = 0;

            document.getElementById("loader").style.display = "none";
            document.getElementById("quiz").style.display = "block";

            renderQuestion();

        }
        catch(err) {

            alert("JSON 文件解析失败");

            console.error(err);
        }

    };

    reader.readAsText(file);

});


// ================================
// 页面加载时恢复题库
// ================================

window.addEventListener("load", function() {

    const saved =
        localStorage.getItem("questionBank");

    if (!saved)
        return;

    try {

        const data = JSON.parse(saved);

        questions = data.questions;

        current =
            Number(
                localStorage.getItem("currentQuestion") || 0
            );

        document.getElementById("loader").style.display = "none";
        document.getElementById("quiz").style.display = "block";

        renderQuestion();

    }
    catch(e) {

        localStorage.removeItem("questionBank");

    }

});


// ================================
// 显示题目
// ================================

function renderQuestion() {

    if (!questions.length)
        return;

    const q = questions[current];

    document.getElementById("progress").textContent =
        `第 ${current + 1} / ${questions.length} 题`;

    document.getElementById("type").textContent =
        q.type;

    document.getElementById("question").textContent =
        q.question;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    const multi =
        q.type === "多选题" ||
        q.answer.length > 1;

    q.options.forEach(option => {

        const label =
            document.createElement("label");

        label.className = "option";

        const input =
            document.createElement("input");

        input.type =
            multi ? "checkbox" : "radio";

        input.name = "answer";

        input.value =
            option.label;

        label.appendChild(input);

        label.append(
            ` ${option.label}. ${option.content}`
        );

        options.appendChild(label);

    });

    const result =
        document.getElementById("result");

    result.style.display = "none";
    result.innerHTML = "";

    localStorage.setItem(
        "currentQuestion",
        current
    );

}


// ================================
// 提交答案
// ================================

function submitAnswer() {

    const q = questions[current];

    const selected =
        [...document.querySelectorAll(
            'input[name="answer"]:checked'
        )]
        .map(x => x.value)
        .sort()
        .join("");

    if (!selected) {

        alert("请先选择答案");
        return;

    }

    const correct =
        q.answer
        .split("")
        .sort()
        .join("");

    const isCorrect =
        selected === correct;

    const result =
        document.getElementById("result");

    result.style.display = "block";

    if (isCorrect) {

        result.className = "correct";

        result.innerHTML =
            "<b>回答正确 ✓</b>";

        wrongQuestions.delete(q.number);

    }
    else {

        result.className = "wrong";

        result.innerHTML =
            "<b>回答错误 ✗</b>";

        wrongQuestions.add(q.number);

    }

    const answer =
        document.createElement("div");

    answer.innerHTML =
        `<br><b>正确答案：</b>${q.answer}`;

    result.appendChild(answer);


    if (q.analysis) {

        const analysis =
            document.createElement("div");

        analysis.className = "analysis";

        analysis.innerHTML =
            "<b>解析：</b>";

        const content =
            document.createElement("div");

        content.textContent =
            q.analysis;

        analysis.appendChild(content);

        result.appendChild(analysis);

    }


    localStorage.setItem(
        "wrongQuestions",
        JSON.stringify([...wrongQuestions])
    );

}


// ================================
// 下一题
// ================================

function nextQuestion() {

    if (current < questions.length - 1) {

        current++;

        renderQuestion();

        window.scrollTo(0,0);

    }

}


// ================================
// 上一题
// ================================

function prevQuestion() {

    if (current > 0) {

        current--;

        renderQuestion();

        window.scrollTo(0,0);

    }

}


// ================================
// 随机题
// ================================

function randomQuestion() {

    current =
        Math.floor(
            Math.random() * questions.length
        );

    renderQuestion();

    window.scrollTo(0,0);

}


// ================================
// 注册 Service Worker
// ================================

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("./sw.js");

}

</script>

</body>
</html>
